name: Update profile images

on:
  schedule:
    # Every hour at HH:01, UTC+8. GitHub cron uses UTC.
    - cron: '1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      # Run the pinned renderer directly to avoid pnpm/action-setup's layout warning (#281).
      - name: Check out repository card renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stats-organization/github-readme-stats-action
          ref: 2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
          path: .profile-cards
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          working-directory: .profile-cards
          runtime: node@24
          install: false
      - name: Install repository card dependencies
        run: pnpm install --frozen-lockfile --prod --ignore-scripts
        working-directory: .profile-cards
      - name: Generate Qwen Code repository card
        run: node .profile-cards/index.js
        env:
          INPUT_CARD: pin
          INPUT_OPTIONS: username=QwenLM&repo=qwen-code&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          INPUT_PATH: dist/pin-qwen-code.svg
          INPUT_FAIL_ON_ERROR: 'true'
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate PractiQ repository card
        run: node .profile-cards/index.js
        env:
          INPUT_CARD: pin
          INPUT_OPTIONS: username=shenyankm&repo=PractiQ&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          INPUT_PATH: dist/pin-practiq.svg
          INPUT_FAIL_ON_ERROR: 'true'
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Clipsey repository card
        run: node .profile-cards/index.js
        env:
          INPUT_CARD: pin
          INPUT_OPTIONS: username=shenyankm&repo=Clipsey&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          INPUT_PATH: dist/pin-clipsey.svg
          INPUT_FAIL_ON_ERROR: 'true'
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
      - name: Check generated images
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          names = ('github-snake', 'github-snake-dark', 'pin-qwen-code', 'pin-practiq', 'pin-clipsey')
          for name in names:
              root = ET.parse(Path('dist') / f'{name}.svg').getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', f'Invalid SVG: {name}'
              assert 'Something went wrong' not in ''.join(root.itertext()), f'Error card: {name}'
          PYTHON
      - name: Publish generated images
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh README images and contribution counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, re, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"], text=True))

          image_sha = api("git/ref/heads/output")["object"]["sha"]
          readme = api("contents/README.md")
          original = base64.b64decode(readme["content"]).decode()
          # Versioned URLs prevent GitHub's image proxy from serving an earlier generation.
          pattern = rf"https://raw\.githubusercontent\.com/{re.escape(repo)}/(?:refs/heads/output|output|[0-9a-f]{{40}})/([\w-]+\.svg)(?:\?[^\"\s)>]*)?"
          updated, count = re.subn(pattern, rf"https://raw.githubusercontent.com/{repo}/{image_sha}/\1", original)
          assert count, "No generated image URLs found in README"
          for upstream_repo, label in (("QwenLM/qwen-code", "Qwen&nbsp;Code"), ("Yeachan-Heo/oh-my-codex", "oh&#8209;my&#8209;codex")):
              upstream = json.loads(subprocess.check_output(["gh", "api", f"repos/{upstream_repo}"], text=True))
              query = f"repo:{upstream_repo} is:pr is:merged author:{os.environ['GITHUB_REPOSITORY_OWNER']}"
              search = json.loads(subprocess.check_output(["gh", "api", "search/issues", "--method", "GET", "-f", f"q={query}", "-f", "per_page=1"], text=True))
              assert not search["incomplete_results"], f"Merged PR search returned incomplete results for {upstream_repo}"
              stars = upstream["stargazers_count"]
              stars_label = f"{stars / 1000:.1f}k" if stars >= 1000 else str(stars)
              repo_url = re.escape(f"https://github.com/{upstream_repo}")
              row_pattern = rf"(\| \[{re.escape(label)}\]\({repo_url}\)<br>\()[\d.,]+k?&nbsp;🌟(\) \| \*\*\[)\d+(\]\({repo_url}/pulls\?[^)]+\)\*\*)"
              updated, count = re.subn(row_pattern, lambda m: f"{m[1]}{stars_label}&nbsp;🌟{m[2]}{search['total_count']}{m[3]}", updated)
              assert count == 1, f"Expected one {upstream_repo} contribution row"
          for project in ("PractiQ", "opencode-tbot"):
              stats = json.loads(subprocess.check_output(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY_OWNER']}/{project}"], text=True))
              stars, forks = stats["stargazers_count"], stats["forks_count"]
              project_pattern = rf"(<strong>{re.escape(project)}</strong></a>&nbsp;\()\d+ stars?, \d+ forks?(\))"
              updated, count = re.subn(project_pattern, lambda m: f"{m[1]}{stars} star{'s' if stars != 1 else ''}, {forks} fork{'s' if forks != 1 else ''}{m[2]}", updated)
              assert count == 1, f"Expected one {project} featured project"
          if updated != original:
              payload = {
                  "message": "chore: refresh profile images and contribution counts\n\nCo-authored-by: Codex <codex@openai.com>",
                  "sha": readme["sha"],
                  "content": base64.b64encode(updated.encode()).decode(),
              }
              subprocess.run(["gh", "api", f"repos/{repo}/contents/README.md", "--method", "PUT", "--input", "-"],
                             input=json.dumps(payload), text=True, check=True)
          PYTHON
