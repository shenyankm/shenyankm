name: Update profile images

on:
  schedule:
    # Daily at 00:00 Beijing time (UTC+8). GitHub cron uses UTC.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Fetch English GHFind score badge
        run: |
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 60 \
            'https://ghfind.com/api/badge/Shenyankm?lang=en' -o dist/ghfind-badge.svg
      - name: Check generated images
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          names = ('github-snake', 'github-snake-dark', 'ghfind-badge')
          for name in names:
              root = ET.parse(Path('dist') / f'{name}.svg').getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', f'Invalid SVG: {name}'
              assert 'Something went wrong' not in ''.join(root.itertext()), f'Error card: {name}'
          badge = ET.parse('dist/ghfind-badge.svg').getroot()
          title = badge.find('{http://www.w3.org/2000/svg}title')
          assert title is not None and re.match(r'GitHub Roast: \d+\.\d{2} [A-Z]', title.text or ''), 'Invalid English GHFind score badge'
          PYTHON
      - name: Publish generated images
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh README image links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, re, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"], text=True))

          image_sha = api("git/ref/heads/output")["object"]["sha"]
          readme = api("contents/README.md")
          original = base64.b64decode(readme["content"]).decode()
          # Versioned URLs prevent GitHub's image proxy from serving an earlier generation.
          pattern = rf"https://raw\.githubusercontent\.com/{re.escape(repo)}/(?:refs/heads/output|output|[0-9a-f]{{40}})/([\w-]+\.svg)(?:\?[^\"\s)>]*)?"
          updated, count = re.subn(pattern, rf"https://raw.githubusercontent.com/{repo}/{image_sha}/\1", original)
          assert count, "No generated image URLs found in README"
          if updated != original:
              payload = {
                  "message": "chore: refresh profile images\n\nCo-authored-by: Codex <codex@openai.com>",
                  "sha": readme["sha"],
                  "content": base64.b64encode(updated.encode()).decode(),
              }
              subprocess.run(["gh", "api", f"repos/{repo}/contents/README.md", "--method", "PUT", "--input", "-"],
                             input=json.dumps(payload), text=True, check=True)
          PYTHON
