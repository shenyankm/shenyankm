name: Update profile images

on:
  schedule:
    # Every hour at HH:01, UTC+8. GitHub cron uses UTC.
    - cron: '1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Generate Qwen Code repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=QwenLM&repo=qwen-code&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          path: dist/pin-qwen-code.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate PractiQ repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=shenyankm&repo=PractiQ&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          path: dist/pin-practiq.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate DocKiln repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=shenyankm&repo=DocKiln&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          path: dist/pin-dockiln.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Clipsey repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=shenyankm&repo=Clipsey&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          path: dist/pin-clipsey.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=shenyankm&line_height=30&theme_light=default&theme_dark=github_dark
          path: dist/stats.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=shenyankm&langs_count=3&theme_light=default&theme_dark=github_dark
          path: dist/top-langs.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check generated images
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          names = ('github-snake', 'github-snake-dark', 'pin-qwen-code', 'pin-practiq', 'pin-dockiln', 'pin-clipsey', 'stats', 'top-langs')
          for name in names:
              root = ET.parse(Path('dist') / f'{name}.svg').getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', f'Invalid SVG: {name}'
              assert 'Something went wrong' not in ''.join(root.itertext()), f'Error card: {name}'
          PYTHON
      - name: Publish generated images
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh README image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, re, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"], text=True))

          image_sha = api("git/ref/heads/output")["object"]["sha"]
          readme = api("contents/README.md")
          original = base64.b64decode(readme["content"]).decode()
          # Versioned URLs prevent GitHub's image proxy from serving an earlier generation.
          pattern = rf"https://raw\.githubusercontent\.com/{re.escape(repo)}/(?:refs/heads/output|output|[0-9a-f]{{40}})/([\w-]+\.svg)(?:\?[^\"\s)>]*)?"
          updated, count = re.subn(pattern, rf"https://raw.githubusercontent.com/{repo}/{image_sha}/\1", original)
          assert count, "No generated image URLs found in README"
          if updated != original:
              payload = {
                  "message": "chore: refresh profile image versions\n\nCo-authored-by: Codex <codex@openai.com>",
                  "sha": readme["sha"],
                  "content": base64.b64encode(updated.encode()).decode(),
              }
              subprocess.run(["gh", "api", f"repos/{repo}/contents/README.md", "--method", "PUT", "--input", "-"],
                             input=json.dumps(payload), text=True, check=True)
          PYTHON
