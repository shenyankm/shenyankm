name: Update profile images

on:
  schedule:
    # Every hour at HH:01, UTC+8. GitHub cron uses UTC.
    - cron: '1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Generate Qwen Code repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=QwenLM&repo=qwen-code&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          path: dist/pin-qwen-code.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate PractiQ repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=shenyankm&repo=PractiQ&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          path: dist/pin-practiq.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate DocKiln repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=shenyankm&repo=DocKiln&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          path: dist/pin-dockiln.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Clipsey repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=shenyankm&repo=Clipsey&show_owner=true&description_lines_count=3&theme_light=default&theme_dark=github_dark
          path: dist/pin-clipsey.svg
          core_version: 2.2.0
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Zig for github-stats
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Generate overview and languages with jstrieb/github-stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_PRIVATE: "true"
          SILENT: "true"
          MAX_RETRIES: "5"
        run: |
          test -n "$ACCESS_TOKEN" || { echo "Set ACCESS_TOKEN to a GitHub user token before generating stats."; exit 1; }
          git init "$RUNNER_TEMP/github-stats-source"
          git -C "$RUNNER_TEMP/github-stats-source" fetch --depth 1 https://github.com/jstrieb/github-stats.git ef574fae2ce8311f3e1ebb43e07c0c0fae0a41b6
          git -C "$RUNNER_TEMP/github-stats-source" checkout --detach FETCH_HEAD
          (cd "$RUNNER_TEMP/github-stats-source" && zig build)
          "$RUNNER_TEMP/github-stats-source/zig-out/bin/github-stats" --json-output-file "$RUNNER_TEMP/stats.json" --overview-output-file dist/overview.svg --languages-output-file dist/languages.svg
          GH_TOKEN="$ACCESS_TOKEN" python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          work = Path(os.environ["RUNNER_TEMP"])
          stats = json.loads((work / "stats.json").read_text())
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          assert stats["user"].lower() == owner.lower()
          tracked = {repo["name"]: repo for repo in stats["repositories"]}
          # Use owned public originals, rather than summing upstream repositories.
          owned = json.loads(subprocess.check_output(["gh", "api", "--paginate", "--slurp", f"users/{owner}/repos?per_page=100&type=owner"], text=True))
          stats["repositories"] = []
          for repo in (repo for page in owned for repo in page if not repo["fork"] and not repo["private"]):
              languages = api(f"repos/{repo['full_name']}/languages")
              colors = {lang["name"]: lang["color"] for lang in tracked.get(repo["full_name"], {}).get("languages", []) or []}
              stats["repositories"].append({"name": repo["full_name"], "stars": repo["stargazers_count"], "forks": repo["forks_count"], "private": False, "lines_changed": 0, "views": 0, "languages": [{"name": name, "size": size, "color": colors.get(name)} for name, size in languages.items()]})
          (work / "stats.json").write_text(json.dumps(stats))
          template = (work / "github-stats-source/src/templates/overview.svg").read_text()
          # These two metrics cannot be verified completely for every owned repo.
          template = re.sub(r"<tr[^>]*>.*?(?:{{ lines_changed }}|{{ views }}).*?</tr>", "", template)
          template = template.replace("Repositories with contributions", "Public original repositories")
          assert "{{ stars }}" in template and "{{ contributions }}" in template
          assert "{{ lines_changed }}" not in template and "{{ views }}" not in template
          (work / "overview-template.svg").write_text(template)
          print(f"Public original repositories: {len(stats['repositories'])}; stars: {sum(repo['stars'] for repo in stats['repositories'])}; forks: {sum(repo['forks'] for repo in stats['repositories'])}")
          PYTHON
          "$RUNNER_TEMP/github-stats-source/zig-out/bin/github-stats" --json-input-file "$RUNNER_TEMP/stats.json" --overview-template "$RUNNER_TEMP/overview-template.svg" --overview-output-file dist/overview.svg --languages-output-file dist/languages.svg
      - name: Check generated images
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          names = ('github-snake', 'github-snake-dark', 'pin-qwen-code', 'pin-practiq', 'pin-dockiln', 'pin-clipsey', 'overview', 'languages')
          for name in names:
              root = ET.parse(Path('dist') / f'{name}.svg').getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', f'Invalid SVG: {name}'
              assert 'Something went wrong' not in ''.join(root.itertext()), f'Error card: {name}'
          PYTHON
      - name: Publish generated images
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh README image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, re, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"], text=True))

          image_sha = api("git/ref/heads/output")["object"]["sha"]
          readme = api("contents/README.md")
          original = base64.b64decode(readme["content"]).decode()
          # Versioned URLs prevent GitHub's image proxy from serving an earlier generation.
          pattern = rf"https://raw\.githubusercontent\.com/{re.escape(repo)}/(?:refs/heads/output|output|[0-9a-f]{{40}})/([\w-]+\.svg)(?:\?[^\"\s)>]*)?"
          updated, count = re.subn(pattern, rf"https://raw.githubusercontent.com/{repo}/{image_sha}/\1", original)
          assert count, "No generated image URLs found in README"
          if updated != original:
              payload = {
                  "message": "chore: refresh profile image versions\n\nCo-authored-by: Codex <codex@openai.com>",
                  "sha": readme["sha"],
                  "content": base64.b64encode(updated.encode()).decode(),
              }
              subprocess.run(["gh", "api", f"repos/{repo}/contents/README.md", "--method", "PUT", "--input", "-"],
                             input=json.dumps(payload), text=True, check=True)
          PYTHON
